<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  canvas#gfx { width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #hud { position: fixed; left: 10px; top: 10px; color: #e8f0ff; font: 12px/1.45 ui-monospace, Consolas, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
  #help { position: fixed; right: 10px; bottom: 10px; color: #dfe8f5; font: 12px/1.5 system-ui; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; opacity: .85; text-align: right; }
  #speed { position: fixed; right: 24px; top: 18px; color: #fff; font: 600 28px/1 system-ui; text-shadow: 0 2px 6px #000; pointer-events: none; }
  #prompt { position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%); color: #fff; font: 600 16px system-ui; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfe0ff; font: 18px system-ui; background: #05070c; }
  #fatal { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #120608; color: #ffd9d9; font: 16px system-ui; text-align: center; padding: 24px; z-index: 10; }
  #fatal h1 { margin: 0; font-size: 28px; color: #ff6b6b; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.6); pointer-events: none; }
  #crosshair.target { background: #ff3020; box-shadow: 0 0 0 6px rgba(255,48,32,.35); }
  #crosshair.hit::before, #crosshair.hit::after { content: ''; position: absolute; left: -8px; top: 1px; width: 20px; height: 2px; background: #fff; transform: rotate(45deg); }
  #crosshair.hit::after { transform: rotate(-45deg); }
  /* 比較用 (?clean=1): HUD と操作説明を隠す */
  body.clean #hud, body.clean #help, body.clean #speed, body.clean #prompt, body.clean #crosshair, body.clean #touch { display: none !important; }
  #credit { display: none; position: fixed; left: 8px; bottom: 6px; z-index: 5; font: 10px/1.3 system-ui, sans-serif; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px rgba(0,0,0,.8); pointer-events: none; }
  body.map-namba #credit { display: block; }
  body.clean #credit { display: none; }
</style>

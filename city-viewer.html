<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Namba City Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #9fb8cf; overflow: hidden; font: 13px system-ui, sans-serif; }
  #hud { white-space: pre-line; position: fixed; left: 12px; top: 12px; padding: 8px 10px; background: rgba(0,0,0,.55); color: #fff; border-radius: 6px; line-height: 1.5; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">読み込み中…</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb8cf);
scene.fog = new THREE.Fog(0x9fb8cf, 250, 700);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 2000);
const q = new URLSearchParams(location.search);
if (q.get("view") === "street") camera.position.set(-30, 1.7, -6.5); // 撮影位置 (道路上)
else camera.position.set(-180, 160, 200);
const controls = new OrbitControls(camera, renderer.domElement);
if (q.get("view") === "street") controls.target.set(20, 6, -4.5); else controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02; // 地面の下に回り込まない

scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x6b6156, 0.9));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6);
sun.position.set(-120, 200, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 200, bottom: -200, near: 10, far: 600 });
sun.shadow.bias = -0.0004;
scene.add(sun);

const hud = document.getElementById("hud");
// ?lod=1 で遠景用の軽量版
const file = q.get("lod") === "1" ? "models/namba_city_lod1.glb" : "models/namba_city_opt.glb";
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(file, (g) => {
  g.scene.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      for (const t of ["map", "normalMap", "roughnessMap", "metalnessMap"]) if (o.material[t]) o.material[t].anisotropy = 8;
    }
  });
  scene.add(g.scene);
  renderer.render(scene, camera);
  const info = renderer.info.render;
  hud.textContent = `draw calls ${info.calls} / 三角形 ${info.triangles.toLocaleString()} — ドラッグで回転、ホイールでズーム
地図データ © OpenStreetMap contributors (ODbL) ／ 建物: 3D 都市モデル (Project PLATEAU) 大阪市 2025 年度 (国土交通省) を加工して作成`;
}, undefined, (e) => (hud.textContent = "読み込み失敗: " + e));

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
